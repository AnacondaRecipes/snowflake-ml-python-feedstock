{% set name = "snowflake-ml-python" %}
{% set version = "1.50.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: ef414324f52c342a764dd37d1bfce2d1c96abf728533ee9209d83b1c484aeab7

build:
  # The build number of this package should always start from 100
  # for new versions. For more information ask the CODEOWNERS.
  number: 100
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<39 or py>313]

requirements:
  host:
    - pip
    - python
    - wheel
    - setuptools >=61.0
  run:
    - python
    - anyio >=3.5.0,<5
    - cachetools >=3.1.1
    - cloudpickle >=2.0.0
    - fsspec >=2024.6.1,<2026
    # For fsspec[http] in conda
    - aiohttp !=4.0.0a0,!=4.0.0a1
    # requests is an extra dependency for fsspec[http]
    - requests
    - h2 >=4.3.0,<5
    - importlib_resources >=6.1.1,<7
    - jinja2 >=3.1.0,<4
    - numpy >=1.23,<3
    - packaging >=20.9,<26
    - pandas >=2.1.4,<3
    - platformdirs <5
    - pyarrow
    - pydantic >=2.8.2,<3
    - pyjwt >=2.0.0,<3
    - pytimeparse >=1.1.8,<2
    - pyyaml >=6.0,<7
    - retrying >=1.3.3,<2
    - scikit-learn <1.9
    - scipy >=1.9,<2
    - shap >=0.46.0,<1
    - snowflake-connector-python >=3.17.3,<5
    - snowflake-snowpark-python >=1.17.0,<2,!=1.26.0
    - sqlparse >=0.4,<1
    - tqdm <5
    - typing-extensions >=4.1.0,<5
    - xgboost <4
    # Import chain (dependency chain causing the failure):
    # snowflake.ml.model → imports model_version_impl
    # model_version_impl → imports _packager.model_handlers.snowmlmodel
    # snowmlmodel.py → import shap
    # shap/__init__.py → shap/_explanation.py
    # _explanation.py → shap/utils/__init__.py
    # shap/utils/__init__.py → shap/utils/_clustering.py
    # _clustering.py → from numba import njit → fails, numba not installed
    - numba
  run_constrained:
    - altair >=5,<7
    - catboost >=1.2.0,<2
    - keras >=2.0.0,<4
    - lightgbm >=4.1.0,<5
    - mlflow >=2.16.0,<3
    - prophet >=1.1.0,<2
    - sentence-transformers >=2.7.0,<6
    - sentencepiece >=0.1.95,<0.3.0
    - streamlit >=1.30.0,<2
    - tensorflow >=2.17.0,<3
    - tokenizers >=0.15.1,<1
    - pytorch >=2.0.1,<3
    - torchdata >=0.4,<1
    - transformers >=4.39.3,<6,!=4.51.3

test:
  imports:
    - snowflake.ml
    - snowflake.ml._internal
    - snowflake.ml.fileset
    - snowflake.ml.model
    - snowflake.ml.modeling
    - snowflake.ml.registry
    - snowflake.ml.utils
    - snowflake.cortex
    - snowflake.ml.data
    - snowflake.ml.dataset
    - snowflake.ml.feature_store
    - snowflake.ml.jobs
    - snowflake.ml.lineage
    - snowflake.ml.monitoring
    - snowflake.ml.utils
    - snowflake.ml.version
  commands:
    - pip check
    # check that pip gets the correct version
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    # Tests/LLM testing is not possible without an active connection to Snowflake environment.
  requires:
    - pip

about:
  home: https://github.com/snowflakedb/snowflake-ml-python
  summary: Snowflake machine learning library.
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE.txt
  description: |
    The machine learning client library that is used for interacting with Snowflake
    to build machine learning solutions. Functionalities include model uploading,
    training, feature engineering, etc.
  dev_url: https://github.com/snowflakedb/snowflake-ml-python
  doc_url: https://docs.snowflake.com/developer-guide/snowflake-ml/overview

extra:
  recipe-maintainers:
    - sumit0190
